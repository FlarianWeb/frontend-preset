name: Release
on:
  push:
    branches:
      - master
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Публикация в npm идёт через доверенный выпуск: workflow получает
      # OIDC-токен и меняет его в реестре на короткоживущий ключ. Долгий
      # NPM_TOKEN в секретах при этом не нужен.
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for chore commit
        run: |
          if ! git log -1 --pretty=%B | grep -q "^chore"; then
            echo "No chore commit detected, skipping release"
            echo "DO_RELEASE=false" >> $GITHUB_ENV
          else
            echo "DO_RELEASE=true" >> $GITHUB_ENV
          fi
      - name: Setup Node.js
        if: ${{ env.DO_RELEASE == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install pnpm
        if: ${{ env.DO_RELEASE == 'true' }}
        run: npm install -g pnpm

      # Доверенный выпуск требует npm не ниже 11.5.1 — версия из образа
      # обычно старее.
      - name: Update npm
        if: ${{ env.DO_RELEASE == 'true' }}
        run: npm install -g npm@latest
      - name: Install dependencies
        if: ${{ env.DO_RELEASE == 'true' }}
        run: pnpm install
      - name: Build
        if: ${{ env.DO_RELEASE == 'true' }}
        run: pnpm run build || exit 1
      - name: Configure Git
        if: ${{ env.DO_RELEASE == 'true' }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
      - name: Release
        if: ${{ env.DO_RELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
